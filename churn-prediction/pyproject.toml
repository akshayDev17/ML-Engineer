[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Churn prediction: dirty synthetic data -> cleaning -> feature selection -> PyTorch MLP -> evaluation -> servable bundle"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "torch>=2.2",
    "optuna>=3.6",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "joblib>=1.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "pydantic>=2", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
